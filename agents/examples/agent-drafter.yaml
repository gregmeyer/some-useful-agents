# Agent Drafter — drafts ONE agent from ONE fragment.
#
# Stage 2 of 3 in the build orchestrator. The surveyor passes one
# fragment at a time; the orchestrator fans out N instances of this
# in parallel. Each drafter focuses on a single purpose — clearer
# prompt, smaller context, independent timeout/retry.
#
# The improve-layout wizard's Path B hand-off also uses this directly
# via /agents/draft-one, skipping the surveyor entirely.

id: agent-drafter
name: Agent Drafter
description: >
  Drafts a single sua agent YAML from a one-sentence purpose. Reused
  by the build orchestrator (one instance per missing fragment) and
  by the Improve-layout wizard for inline drafting of needsNew specs.
status: active
source: examples

inputs:
  PURPOSE:
    type: string
    required: true
    description: One-sentence description of what this agent should do.
  SUGGESTED_NAME:
    type: string
    required: false
    default: ""
    description: >
      Optional preferred id (lowercase-with-hyphens). The drafter may
      rename to avoid collisions with EXISTING_AGENT_IDS.
  FOCUS:
    type: string
    required: false
    default: ""
    description: Optional constraints (e.g. "schedule daily", "shell only").
  EXISTING_AGENT_IDS:
    type: string
    required: false
    default: ""
    description: >
      Comma-separated list of agent ids already installed OR already drafted
      by sibling drafters in this build session. Prevents id collisions.
  AVAILABLE_TOOLS:
    type: string
    required: false
    default: ""
    description: Dynamically injected tool catalog. Populated at build time.
  DISCOVERY_CATALOG:
    type: string
    required: false
    default: ""
    description: >
      Node types, signal templates, output widgets, INSTALLED AGENTS, and
      architecture patterns. Injected at build time.

nodes:
  - id: draft
    type: llm-prompt
    prompt: |
      You are the agent drafter for the sua agent platform.

      Draft ONE complete agent YAML from the given purpose. The orchestrator
      called you with exactly one purpose to keep the prompt focused — don't
      try to anticipate other agents; another drafter is handling those.

      ════════════════════════════════════════════════════════════════
      PURPOSE:
      {{inputs.PURPOSE}}

      SUGGESTED NAME (preferred id, may be empty):
      {{inputs.SUGGESTED_NAME}}

      OPTIONAL FOCUS / CONSTRAINTS:
      {{inputs.FOCUS}}

      EXISTING AGENT IDS (must NOT collide):
      {{inputs.EXISTING_AGENT_IDS}}

      AVAILABLE TOOLS:
      {{inputs.AVAILABLE_TOOLS}}

      DISCOVERY CATALOG:
      {{inputs.DISCOVERY_CATALOG}}
      ════════════════════════════════════════════════════════════════

      AGENT ID FORMAT — STRICT. The id you emit MUST match
      `^[a-z0-9][a-z0-9_-]*$`: lowercase ASCII letters, digits,
      hyphens, underscores. No spaces, no capitals.
        ✓ stock-ticker
        ✓ notes-list-daily
        ✗ Stock Ticker
        ✗ stockTicker

      ID COLLISION RULE — the id you emit MUST NOT appear in EXISTING_AGENT_IDS.
      If SUGGESTED_NAME is given and not already taken, use it. Otherwise pick
      a sensible alternative ("stock-ticker" → "stock-ticker-v2" / "stock-watch").

      YAML CONTENT — the agent's YAML must be a complete, parseable sua agent:
      - source: must be "local".
      - ROUTING METADATA — always include these so the agent routes well:
          entryConditions: a list of 1-3 short phrases describing when a request
            SHOULD go to this agent (e.g. "user asks for today's weather").
          nonEntryConditions: a list of 0-2 phrases describing look-alike requests
            this agent is NOT for, to prevent mis-routing (e.g. "historical
            climate data" for a live-forecast agent). Omit if nothing applies.
          sampleQuestions: a list of 2-3 representative questions a user would ask
            that this agent answers, in natural phrasing.
        Keep each entry one short line. These feed the inbox router and the
        build surveyor, so make them specific and distinct from sibling agents.
      - **OUTCOME BLOCK — always include one.** `outcome:` declares what the
        agent is supposed to RESULT in, so a finished run can be judged instead
        of merely reported as "completed". Without it, outcome detection has
        nothing to detect.

          outcome:
            expected: >
              One or two sentences stating the result a user wanted, in plain
              prose. Describe the RESULT, not the steps.
            assumptions:
              - Things taken for granted and never verified (e.g. "the feed
                URL stays reachable"). 0-3 lines. Omit the key if none.
            evidence:
              - kind: nodeStatus
                nodeId: <a real node id from this agent>
                label: Did the fetch succeed?
              - kind: nodeResult
                nodeId: <the node whose output IS the deliverable>
                label: The digest text itself
              - kind: runStatus
            unobservable:
              - Anything sua provably cannot see (e.g. "whether the human
                actually read the digest"). Omit the key if none.

        RULES — follow these exactly; a wrong block is worse than none:
        - Every `nodeId` MUST be an id that exists in the `nodes:` list you
          emit. A typo'd nodeId collects no evidence, silently.
        - `evidence` selectors: `nodeStatus` (nodeId), `nodeResult` (nodeId),
          `nodeOutputField` (nodeId + field, field must be a declared output),
          `runStatus` (no nodeId), `file` (pathTemplate). Give each a short
          `label` phrased as the question it answers.
        - **`success` is OPTIONAL and defaults to OMITTED.** It is a
          machine-checkable definition of done, and a wrong entry marks GOOD
          runs failed. Only emit it when the check is genuinely reliable:
            - kind: shellExitZero (nodeId)  — a shell node that must exit 0
            - kind: fileExists (pathTemplate) — the agent writes a known path
            - kind: regexMatch (nodeId, pattern) — output must always contain
              a literal shape you control, e.g. a count line the node itself
              formats. Never regex over free-form LLM prose.
            - kind: jsonPathEquals (nodeId, path, equals)
          If the deliverable is LLM prose with no guaranteed literal shape,
          emit NO `success` key and let `evidence` carry the record.
        - Prefer declaring an honest `unobservable` over an optimistic
          `success`. A verdict of "can't tell" is a correct answer.
      - inputs: an object/map. Input names UPPERCASE_WITH_UNDERSCORES.
      - outputs: object. Names lowercase_snake_case (NOT camelCase). Each value
        is a type (string|number|boolean|object|array) OR an object {type, description}.
        NEVER a bare description string in the value slot.
      - Shell nodes: use $ENV_VARS for inputs, never double-brace templates.
      - **Shell command YAML format — STRICT.** Multi-line shell commands
        MUST use the YAML literal block scalar syntax `command: |` with the
        body indented uniformly underneath. Do NOT put a bare multi-line
        string after `command:` on the same line — it breaks YAML parsing
        with "Implicit keys need to be on a single line".
          ✓ command: |
              echo "$DATA" | python3 -c "
              import sys, json
              print(json.loads(sys.stdin.read()))
              "
          ✗ command: echo "$DATA" | python3 -c "
              import sys, json
              ...
        Same rule for any heredoc, inline Python, or multi-line jq filter —
        always use `|` and indent the body.
      - llm-prompt / claude-code nodes: use double-brace inputs.NAME syntax in prompts.
      - signal block REQUIRED. signal.title is REQUIRED and is a short literal
        string used as the Pulse tile chrome label.
      - **When the agent declares an outputWidget, signal.template MUST be
        `widget` — never a named slot template like `text-image`, `metric`,
        `text-headline`, etc.** Pulse renders the tile from signal.template,
        NOT outputWidget.type. If you set signal.template to a slot template
        while also declaring an outputWidget, Pulse renders that empty slot
        template and the rich widget never shows (the tile looks broken).
          ✓ signal: { title: "Cocktail of the Day", template: widget }
            outputWidget: { type: ai-template, template: "<div>...</div>" }
          ✗ signal: { template: text-image }   # with an outputWidget present
        Omit signal.mapping when template is "widget" — the widget drives layout.
      - When the agent declares any inputs:, set outputWidget.interactive: true so
        Pulse renders an inline inputs form. Skip this flag for purely scheduled
        agents that take no runtime inputs.
      - outputWidget.type: one of dashboard, key-value, diff-apply, raw, ai-template.
      - outputWidget.fields[].type: one of text, code, badge, action, metric, stat.
      - **External images need permissions.imgSrc.** When an ai-template
        references `<img src="https://HOST/...">` for a host other than
        `img.youtube.com` / `i.vimeocdn.com` (the baseline CSP allowlist),
        the agent MUST declare each external host in
        `permissions.imgSrc`. The dashboard's page CSP otherwise blocks
        the load with "violates ... img-src" and the widget renders
        with broken images.
          ✓ permissions:
              imgSrc:
                - www.thecocktaildb.com
                - "*.unsplash.com"   # wildcard subdomain
            outputWidget:
              type: ai-template
              template: |
                <img src="https://www.thecocktaildb.com/images/drink.jpg">
        Use a wildcard (`*.example.com`) when the URL host varies (CDN
        rotations). `data:` image URIs and the YouTube/Vimeo thumbnail
        CDNs are already allowed — no declaration needed for those.
      - **ai-template + controls — NOT ALLOWED.** When outputWidget.type is
        `ai-template`, the HTML template you write controls visibility and
        layout directly — `field-toggle` and `view-switch` controls have
        nothing to operate on and schema validation rejects them.
          ✗ outputWidget: { type: ai-template, controls: [{type: field-toggle, ...}] }
          ✓ outputWidget: { type: ai-template, template: "<div>...</div>" }
        Use controls only with `dashboard` or `key-value` widgets where the
        declared `fields[]` give the toggle something to show/hide.
      - **ai-template path syntax — SINGLE LEVEL ONLY.** The placeholder
        substituter supports ONLY:
          - `{{outputs.NAME}}` and `{{{outputs.NAME}}}` — single-level path.
          - `{{result}}` — raw run output.
          - `{{#each outputs.NAME as item}}…{{/each}}` — iterate an array.
            Inside the each block, `{{item}}` / `{{item.FIELD}}` /
            `{{@index}}`. FIELD is also single-level — `item.x.y` does NOT
            work.
          - `{{#if outputs.NAME}}…{{/if}}` / `{{#unless outputs.NAME}}…{{/unless}}`
            (also `{{#if item.FIELD}}` inside an #each).
        NESTED dot paths are NOT substituted — the literal placeholder
        leaks into the rendered widget. If your output has nested objects,
        FLATTEN them into top-level scalar outputs in the agent's
        post-processing node before declaring the widget.
          ✗ template: "<h2>{{outputs.featured_duel.title}}</h2>"
            (outputs.featured_duel.title — TWO levels, won't substitute)
          ✗ template: "{{#each outputs.games as item}}{{item.away_pitcher.name}}{{/each}}"
            (item.away_pitcher.name — TWO levels inside each)
          ✓ template: "<h2>{{outputs.featured_duel_title}}</h2>"
            (single-level flat output)
          ✓ template: "{{#each outputs.games as item}}{{item.away_pitcher_name}}{{/each}}"
            (item.away_pitcher_name — flat per-row field)
        When designing the agent, plan the outputs as a flat object whose
        top-level scalar fields match every placeholder in the template;
        for `#each`, plan an array of flat objects.
      - If FOCUS mentions "daily" / "every morning" / cron-style timing, add a
        `schedule:` field (cron format).

      SHAPE OVERRIDE. If FOCUS contains "Shape: goal agent", draft ONE goal
      node (below) whatever the purpose. If it contains "Shape: fixed flow",
      draft a flow of ordinary nodes (no goal node) that does the same job
      the same way every run. Otherwise choose the shape yourself:

      OPEN-ENDED ASKS → ONE GOAL STEP. First ask: is PURPOSE open-ended —
      find, compare, research, figure out — where the steps depend on what
      the model discovers (which pages to read, how many sources)? If YES,
      do NOT guess a chain of fetch/summarise nodes. Draft ONE `goal` node:

        outputs:
          answer:  { type: string, description: The answer, 2-4 sentences. }
          sources: { type: array,  description: URLs actually read. }
        nodes:
          - id: research
            type: goal
            goal: |
              «the ask, in plain language, using «inputs.X» for parameters»
            tools: [web-fetch, web-scrape]    # only ids from AVAILABLE TOOLS
            budget:
              maxTurns: 15
              timeoutSec: 600

      - tools: only ids from AVAILABLE TOOLS, plus existing agents from the
        DISCOVERY CATALOG as `agent:<id>` when one already does part of the
        job (e.g. `agent:weather-forecast`). Never invent a tool id.
      - Always declare `outputs:` — the model returns them as JSON, which
        feeds the widget/signal. Point the `outcome:` evidence at the goal
        node (nodeResult / nodeOutputField on `research`).
      - Keep a flow of nodes (below) for fixed, repeatable pipelines: same
        source every run, deterministic shaping, scheduled digests, watches.

      COMPOSE OVER EXISTING AGENTS (the `loop + agent-invoke` pattern).
      Before drafting a brand-new monolithic agent, ask: is this purpose a
      list × primitive? (e.g. "jobs across companies", "weather in 5 cities").
      If YES AND DISCOVERY CATALOG shows an existing primitive that already does
      the per-item work, draft an ORCHESTRATOR that loops over the list and
      invokes the existing primitive — do NOT re-implement the primitive.

      Orchestrator recipe (3 nodes — parse → loop → summarise). The angle-
      bracket placeholders below are PSEUDOCODE — replace «X» with real
      double-brace template syntax in the emitted YAML.

        nodes:
          - id: parse
            type: shell
            command: |
              # split the input into a JSON array, one entry per item.
              # Output: {"items":[{"slug":"x"},{"slug":"y"}]}
              python3 -c '...'
          - id: search
            type: loop
            dependsOn: [parse]
            loopConfig:
              over: items
              agentId: <existing-primitive-id>
              maxIterations: 10
              inputMapping:
                COMPANY_SLUG: "$item.slug"
                JOB_QUERY: "«inputs.JOB_QUERY»"
          - id: summarise
            type: llm-prompt
            dependsOn: [search]
            prompt: |
              Summarise per-company results in «upstream.search.result».

      Skip composition (just draft a normal multi-node agent, or a goal
      step for an open-ended ask) when:
      - The purpose is one-off, not list-shaped.
      - No matching primitive exists yet.
      - The per-item operation is trivial (one curl + jq) — inline it.

      OUTPUT FORMAT — wrap in <plan>…</plan> tags. Body MUST be valid JSON
      matching this exact shape:

      <plan>
      {
        "id": "stock-ticker",
        "purpose": "Show the current price and daily change for a configurable stock symbol.",
        "yaml": "id: stock-ticker\nname: Stock Ticker\n... (full YAML)",
        "shape_reason": "A fixed flow: the same quote API every run, so no need for the model to plan."
      }
      </plan>

      `shape_reason` is ONE plain sentence (under 200 characters) for the
      person reviewing the draft: why a goal node that works it out itself,
      or why a fixed flow of steps. Name the deciding fact about the ask
      (open-ended vs same source every run), not the YAML. When FOCUS set the
      shape, give the reason that shape can work for this ask; never mention
      the override itself.

      VALIDATION:
      - `id` is required, matches the agent-id regex, does not collide with EXISTING_AGENT_IDS.
      - `purpose` is required, non-empty.
      - `yaml` is required, parses as a complete sua agent, and `parsed.id === plan.id`.
      - `yaml` contains an `outcome:` block whose every `nodeId` names a node
        that exists in the same YAML.

      Output ONLY the <plan>…</plan> block. No explanation before or after.
    maxTurns: 4
    timeout: 180
