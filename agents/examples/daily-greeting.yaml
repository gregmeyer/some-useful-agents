# Tutorial step 3: Schedule an agent to run on a cron.
# Teaches: schedule field, cron syntax.
# Run: sua workflow run daily-greeting
id: daily-greeting
name: Daily greeting
description: Scheduled agent — greets you every morning at 8am.
status: active
source: examples
schedule: "0 8 * * *"
signal:
  title: Morning Greeting
  icon: "\u2600\uFE0F"
  format: text
  template: text-headline
  mapping:
    headline: Good Morning
    body: result
  refresh: 24h
tags:
  - greeting
  - scheduled
  - morning
  - hello
  - routine
entryConditions:
  - user wants a friendly greeting delivered on a schedule each morning
  - user wants a simple recurring good morning message
nonEntryConditions:
  - user wants an actual briefing with content in it (use daily-summary)
sampleQuestions:
  - Greet me when I start work every day.
  - Send a good morning note on a schedule.
  - Say hello to me each morning.
nodes:
  - id: greet
    type: shell
    command: echo "Good morning! Today is $(date +%A), $(date +%B\ %d)."
