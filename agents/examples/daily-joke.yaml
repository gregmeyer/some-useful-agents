# Tutorial step 7: Fetch real data from the internet.
# Teaches: http-get tool, network egress, structured output.
# NOTE: This example requires network access (icanhazdadjoke.com).
# Run: sua workflow run daily-joke
id: daily-joke
name: Daily joke
description: Fetches a real joke from the internet using the http-get tool.
status: active
source: examples
tags:
  - joke
  - humor
  - scheduled
  - morning
  - daily
entryConditions:
  - user wants a joke or something funny
  - user wants the agent to send them a joke every morning on a schedule
nonEntryConditions:
  - user wants a joke invented about a specific topic (use llm-tells-a-joke)
sampleQuestions:
  - Tell me a joke to start the day.
  - Send over today's joke please.
  - Give me my morning laugh.
outputs:
  result:
    type: string
    description: The plain-text joke (one or two lines).
signal:
  title: Joke of the Day
  icon: "\U0001F3AD"
  template: text-headline
  mapping:
    headline: Joke of the Day
    body: result
  refresh: 24h
  size: 2x1
  accent: purple
nodes:
  - id: fetch
    type: shell
    tool: http-get
    toolInputs:
      url: "https://icanhazdadjoke.com/"
      # Without an explicit Accept header icanhazdadjoke serves its HTML
      # web page (their browser default). Asking for JSON gets us the
      # documented {id, joke, status} shape that the format node parses.
      headers:
        Accept: "application/json"
        User-Agent: "some-useful-agents (+https://github.com/gregmeyer/some-useful-agents)"
  - id: format
    type: shell
    command: |
      echo "=== Joke of the Day ==="
      JOKE=$(echo "$UPSTREAM_FETCH_RESULT" | grep -o '"joke":"[^"]*"' | sed 's/"joke":"//;s/"$//' 2>/dev/null)
      if [ -n "$JOKE" ]; then
        echo "$JOKE"
      else
        echo "$UPSTREAM_FETCH_RESULT"
      fi
    dependsOn: [fetch]
