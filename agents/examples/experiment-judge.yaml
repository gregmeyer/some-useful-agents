# Experiment judge — scores one result of a ranking experiment against a
# rubric written in plain words (ADR-0078). It is shown the items, what the
# person wants and the ranking; never which build produced it, so it can't
# favour one. The dashboard keeps its score only when it is a number from 0
# to 1 with a reason that points to items in the result
# (core cleanJudgement). Run only by an experiment; never proposed in triage.

id: experiment-judge
name: Experiment judge
description: >
  Scores one ranking from 0 to 1 against a rubric, with a reason and the
  items the reason rests on. Used by an experiment's judge scorers.
status: active
source: examples

inputs:
  RUBRIC:
    type: string
    required: true
    description: What a good result looks like, in plain words.
  ITEMS:
    type: string
    required: true
    description: The items that were ranked, as a JSON list of {id, title, facts}.
  RANKING:
    type: string
    required: true
    description: The result to score, as a JSON list of ids, best first.
  PREFERENCES:
    type: string
    required: false
    default: ""
    description: What the person wants, in their words. May be empty.
  ERRORS:
    type: string
    required: false
    default: ""
    description: Why the last answer couldn't be used (when trying again).

nodes:
  - id: judge
    type: llm-prompt
    maxTurns: 1
    timeout: 180
    outputContract:
      mustMatch: '<score>[\s\S]*?</score>'
      description: a <score> JSON block
    prompt: |
      Score one ranking against a rubric. You are one of several checks in
      an experiment; you are not told how the ranking was made, and you
      must not guess.

      The rubric (what a good ranking looks like):
      ----------
      {{inputs.RUBRIC}}
      ----------

      What the person wants. When this is empty, the rubric alone decides:
      ----------
      {{inputs.PREFERENCES}}
      ----------

      The items that were ranked, as a JSON list. Each has an "id", a
      "title" and "facts":
      ----------
      {{inputs.ITEMS}}
      ----------

      The ranking to score: the items' ids, best first:
      ----------
      {{inputs.RANKING}}
      ----------

      {{inputs.ERRORS}}

      Rules:
        - Judge ONLY from the facts given for each item. Nothing you know
          about a company, product or place from anywhere else. A fact
          that isn't given is unknown, not good or bad.
        - Score how well this ranking meets the rubric: 1 means it meets
          it fully, 0 means not at all, and in between for partly. Use the
          whole range; do not default to the middle.
        - Give the same ranking the same score every time: decide from the
          positions of the items the rubric cares about, not from an
          overall impression.
        - Your reason is one or two plain sentences that name where the
          items it rests on are placed ("the two remote roles are 7th and
          9th").
        - "cites" is the ids of the items your reason rests on, exactly as
          given. At least one.

      Answer with a <score> block and nothing after it:

      <score>
      {"score": 0.0, "reason": "…", "cites": ["an-item-id"]}
      </score>
