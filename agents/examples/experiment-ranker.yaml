# Experiment ranker — the default task of a ranking experiment (ADR-0078):
# given a fixed list of items, a person's preferences and the instructions
# of the build being tested, it returns every item's id, best first. An
# experiment runs it once per condition and repeat and compares the lists
# in code (core experiment-measures.ts); the dashboard throws away an
# answer that leaves an item out or names one that isn't in the list.
# Run only by an experiment; never proposed in triage.

id: experiment-ranker
name: Experiment ranker
description: >
  Ranks a fixed list of items for a person's preferences, following the
  instructions it is given. The default task of a ranking experiment.
status: active
source: examples

inputs:
  ITEMS:
    type: string
    required: true
    description: The items to rank, as a JSON list of {id, title, facts}.
  PREFERENCES:
    type: string
    required: false
    default: ""
    description: What the person wants, in their words. May be empty.
  INSTRUCTIONS:
    type: string
    required: false
    default: ""
    description: How this build decides what is a better fit. May be empty.
  ERRORS:
    type: string
    required: false
    default: ""
    description: Why the last answer couldn't be used (when trying again).

nodes:
  - id: rank
    type: llm-prompt
    maxTurns: 1
    timeout: 180
    outputContract:
      mustMatch: '<ranking>[\s\S]*?</ranking>'
      description: a <ranking> JSON list of ids
    prompt: |
      Rank the items below from the best fit to the worst, for the person
      described. This is one run of an experiment that compares rankings,
      so rank by what you are given here and nothing else.

      How to decide what fits better (the build's instructions). When
      this is empty, use your own judgement of fit to the preferences:
      ----------
      {{inputs.INSTRUCTIONS}}
      ----------

      What the person wants (their preferences). When this is empty,
      rank by the instructions alone:
      ----------
      {{inputs.PREFERENCES}}
      ----------

      The items, as a JSON list. Each has an "id", a "title" and "facts":
      ----------
      {{inputs.ITEMS}}
      ----------

      {{inputs.ERRORS}}

      Rules:
        - Use ONLY the facts given for each item. Nothing you know about
          a company, product or place from anywhere else, and nothing
          guessed. A fact that isn't given counts as unknown, not as good
          or bad, unless the instructions say how to treat unknowns.
        - Rank EVERY item exactly once. Do not leave any out, do not add
          any, and do not repeat one.
        - Use each item's "id" exactly as given.
        - Ties are not allowed: put one before the other.

      Answer with the ids only, best first, as a JSON list inside a
      <ranking> block, and nothing after it:

      <ranking>
      ["id-of-the-best", "id-of-the-next", "..."]
      </ranking>
