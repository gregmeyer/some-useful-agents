# Experiment set advisor — reads the question an experiment is meant to
# answer and says which facts about the items it turns on, and which of the
# operator's notebooks would be the best set to hold fixed (ADR-0078). The
# dashboard has already ranked the notebooks on what they hold (counted);
# this adds a reading of the question. Its answer is checked in code
# (lib/experiment-set.ts): a fact it names must be one a notebook notes, and
# its pick must be one of the notebooks listed. Run only from the New
# experiment page; never proposed in triage.

id: experiment-set-advisor
name: Experiment set advisor
description: >
  Reads an experiment's question and says which facts about the items it
  turns on, and which notebook's options suit it as the set to hold fixed.
status: active
source: examples

inputs:
  QUESTION:
    type: string
    required: true
    description: What the experiment is meant to find out, in the person's words.
  CHANGES:
    type: string
    required: false
    default: ""
    description: What the experiment changes between runs, when that is known yet.
  SETS:
    type: string
    required: true
    description: >
      The notebooks it could use, as JSON: id, title, what it is for, how
      many options, the facts noted (label and for how many), and two
      example options.
  ERRORS:
    type: string
    required: false
    default: ""
    description: Why the last answer couldn't be used (when trying again).

nodes:
  - id: advise
    type: llm-prompt
    maxTurns: 1
    timeout: 120
    outputContract:
      mustMatch: '<advice>[\s\S]*?</advice>'
      description: an <advice> JSON block
    prompt: |
      Someone is setting up an experiment: one agent will rank the same
      set of items several ways (different instructions, preferences or
      models), and the rankings are compared. They must choose which set
      of items to hold fixed. Help them choose.

      What they want to find out:
      ----------
      {{inputs.QUESTION}}
      ----------

      What they will change between runs (may be empty if not decided):
      ----------
      {{inputs.CHANGES}}
      ----------

      The sets they could use: their notebooks, as JSON. Each has an
      "id", a "title", what it is "for", how many "options", the "facts"
      noted about its options (each with "label" and "notedFor", such as
      "9 of 14"), and two "examples":
      ----------
      {{inputs.SETS}}
      ----------

      {{inputs.ERRORS}}

      Work out:
        1. Which facts about an item the rankings will turn on. A ranking
           can only differ between versions if the items differ in
           something the versions care about: a question about pay
           against preferences turns on pay and on whatever the
           preferences mention (remote, location, seniority). Name up to
           four, each by the EXACT "label" of a fact in one of the sets.
        2. Which set suits the experiment best: its items are the kind of
           thing the question is about, it has enough of them, and the
           facts from 1 are noted for most. Give its "id", or "" when
           none of them suits.
        3. Anything the question needs that NO set notes at all (up to
           three, a few words each). Usually none.

      Rules:
        - Use only what is in SETS. Do not assume a notebook holds a fact
          it doesn't list, and do not invent a set.
        - "turnsOn" labels must be copied exactly from a "facts" list.
        - "why" is one plain sentence for the person, about the set you
          picked (or why none suits). No numbers that aren't in SETS.

      Answer with an <advice> block and nothing after it:

      <advice>
      {"turnsOn": [{"fact": "<label>", "because": "<a few words>"}], "pick": "<id or empty>", "why": "…", "missing": []}
      </advice>
