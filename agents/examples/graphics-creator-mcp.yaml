# Graphics creator (MCP) — single claude-code node that calls the
# modern-graphics MCP server to render a hero graphic from a topic.
#
# Earlier versions tried a 6-node theme-then-render-then-composite pipeline
# and accumulated bugs (missing prompts, broken upstream wiring, theme
# steps that never produced reusable output). This version trusts the LLM
# to pick a theme + write a punchy headline + call generate_graphic in one
# round-trip. Simpler, faster, and actually works.
#
# Prereq (one-time): import the modern-graphics MCP server via
# /tools/mcp/import (docs/mcp.md: run it in Docker sharing a folder as
# /app/output, working folder /app). The agent uses these MCP tools:
#   modern-graphics-list-themes       (browse themes when the user didn't pin one)
#   modern-graphics-get-layout-help   (the args each layout takes)
#   modern-graphics-generate-graphic  (render the actual file)
#
# It saves into OUTPUT_DIR as the server sees it ("output", the shared
# folder), and sua reads the file from the matching folder on this computer,
# so the picture shows in a conversation and can be added to an answer.
#
# Run: sua workflow run graphics-creator-mcp -i TOPIC="Q2 growth wins"
id: graphics-creator-mcp
name: Graphics creator (MCP)
description: |
  Generate a polished hero graphic from a topic using the modern-graphics
  MCP server. One claude-code node: pick a theme, write a punchy title,
  call generate_graphic, return a structured JSON pointer to the file.
status: active
source: examples
tags:
  - graphics
  - hero
  - illustration
  - image
  - artwork
entryConditions:
  - user wants a polished hero image or illustration for a post, deck, or launch
  - user wants a generated graphic on a topic
nonEntryConditions:
  - user wants a data chart plotted from numbers (use chart-creator-mcp)
  - user wants an illustration, artboard or illustrated steps with drawings in each panel (use artboard-illustrator; this one only fills text templates)
sampleQuestions:
  - Make a hero graphic for my launch announcement.
  - Design artwork for this deck opener.
  - I need an illustration about remote work.
mcp: false

inputs:
  TOPIC:
    type: string
    required: true
    description: What the graphic is about, e.g. "Q2 growth wins". For steps or panels, list them in order.
  LAYOUT:
    type: enum
    required: false
    default: auto
    description: >
      modern-graphics layout. auto picks one from the topic: grid for
      numbered steps or panels, timeline for dated events, comparison for
      two sides, hero otherwise. Stick to text-driven layouts here; chart
      layouts need data, use chart-creator-mcp instead.
    values:
      - auto
      - hero
      - hero-triptych
      - insight-card
      - insight-story
      - key-insight
      - story
      - comparison
      - timeline
      - funnel
      - grid
  SUBTITLE:
    type: string
    required: false
    default: ""
    description: Optional one-line subtitle. Leave blank for the LLM to derive one from TOPIC.
  THEME:
    type: string
    required: false
    default: ""
    description: Specific theme name to use (e.g. "operator", "warm"). Leave blank to let the LLM pick one that fits the topic.
  AUDIENCE:
    type: string
    required: false
    default: general
    description: Target reader — guides tone (e.g. "investors", "developers", "executives").
  OUTPUT_DIR:
    type: string
    required: false
    default: output
    description: >
      Where the graphics server saves the file, as the server sees it.
      "output" is the folder its Docker setup shares with this computer
      (-v <folder>:/app/output with -w /app, docs/mcp.md), so sua can show
      the picture and add it to an answer. A folder the server doesn't
      share stays inside its container.

nodes:
  - id: render
    type: llm-prompt
    timeout: 180
    maxTurns: 8
    tools:
      - modern-graphics-list-themes
      - modern-graphics-get-layout-help
      - modern-graphics-generate-graphic
    prompt: |
      You are rendering a single graphic for: **{{inputs.TOPIC}}**
      Audience: {{inputs.AUDIENCE}}
      Layout: {{inputs.LAYOUT}}
      Theme preference: {{inputs.THEME}} (blank = pick one from the list)
      Subtitle preference: {{inputs.SUBTITLE}} (blank = derive from TOPIC)

      Steps:

      1. LAYOUT — if Layout is "auto", choose it from the topic: "grid"
         when it lists numbered steps, panels or items (keep every one, in
         order); "timeline" for dated events; "comparison" for two sides;
         "hero" for one message. Otherwise use the layout given.

      2. THEME — if THEME is blank, call `modern-graphics-list-themes` and
         pick the one that best fits the topic + audience.

      3. TITLE — write a punchy 4–8 word title from TOPIC. No trailing
         punctuation. If SUBTITLE is blank, write a one-line supporting
         sentence (≤ 12 words) yourself; otherwise use SUBTITLE verbatim.

      4. RENDER — call `modern-graphics-get-layout-help` for the layout and
         shape its args exactly as it says (a grid takes "items", one per
         step or panel in order, and "columns": 3 for six items, 2 for
         four). Then call `modern-graphics-generate-graphic` with the
         layout, those args, the title, subtitle, theme, format png, and
         output_path: {{inputs.OUTPUT_DIR}}/<short-topic-slug>-<unix-timestamp>.png

         If the call fails, inspect the error and retry ONCE with corrected
         arguments. Do not retry more than once.

      5. RETURN — output ONLY a raw JSON object — no markdown fences, no
         prose, no surrounding text:

         {
           "title": "<title you used>",
           "subtitle": "<subtitle you used>",
           "layout": "<layout you used>",
           "theme": "<theme name you used>",
           "graphic_path": "<the path generate_graphic returned, as it gave it>",
           "topic": "<TOPIC, shortened to one line>"
         }

      Constraints:
      - Make exactly ONE generate_graphic call (plus at most one retry on error).
      - If a tool is unavailable or rendering fails, return {"error": "<what failed>"}; never invent a path.
      - Output must be valid JSON; the agent's output widget parses it.

signal:
  title: Graphic
  template: text-image
  size: 2x2

outputWidget:
  type: dashboard
  interactive: true
  runInputs: [TOPIC, LAYOUT, THEME]
  askLabel: Generate graphic
  replayLabel: Generate another
  fields:
    - { name: title,        type: text,   label: Title }
    - { name: subtitle,     type: text,   label: Subtitle }
    - { name: layout,       type: badge,  label: Layout }
    - { name: theme,        type: badge,  label: Theme }
    - { name: graphic_path, type: preview, label: Output }
