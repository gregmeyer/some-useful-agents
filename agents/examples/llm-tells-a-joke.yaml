id: llm-tells-a-joke
name: LLM tells a joke
description: Tells a groan-worthy dad joke, optionally on a specific topic.
status: active
source: examples

tags:
  - joke
  - humor
  - pun
  - comedy
  - on-demand
entryConditions:
  - user wants a joke made up on the spot, optionally about a topic like programming or coffee
  - user wants a dad joke or pun about something specific
nonEntryConditions:
  - user wants a joke delivered automatically each morning (use daily-joke)
sampleQuestions:
  - Make up a pun about databases.
  - Give me something groan-worthy about coffee.
  - Say the corniest thing you can about cats.
inputs:
  TOPIC:
    type: string
    default: coffee
    required: false
    description: Optional topic for the joke (e.g. programming, animals, coffee)

outputs:
  result:
    type: string
    description: The joke text (one or two lines, plain text).

signal:
  title: Dad Joke
  icon: "\U0001F604"
  format: text
  template: text-headline
  mapping:
    headline: Dad Joke
    body: result
  refresh: 24h

nodes:
  - id: main
    type: llm-prompt
    prompt: |
      You are a world-class dad-joke comedian. Tell exactly one groan-worthy dad joke.

      Topic: {{inputs.TOPIC}}
      If the topic is empty or blank, pick any random everyday topic.

      Rules:
      - Classic setup/punchline format.
      - Keep it clean and family-friendly.
      - Just the joke — no preamble, no explanation, no commentary, no emoji.
      - Plain text only, no markdown formatting.
    maxTurns: 1
    timeout: 30
