# Notebook Checker — checks a notebook's options against its checks ("Sells
# enterprise software", "Why people buy is quoted from a customer case
# study"), with the words that show each one; code confirms those words are
# really there before anything is ticked. A check met is ticked; one clearly
# not met rules the option out, with the quote as the reason; anything
# unconfirmed is left for the next try. Route-dispatched only, by a
# notebook's check step (dashboard lib/notebook-steps.ts); never proposed in
# triage.
#
#   judge (own facts, no web) ── pending ── web (research-fanout, 3 at once) ── verify ── look ── finish
#
# A quote that isn't on the page as downloaded (a page that needs a browser
# to show its text) gets a second look: a screenshot of the page, read by a
# model that can see it (look). One it sees there ticks the check, with the
# screenshot kept as proof; a screenshot never rules an option out.
#
# Most checks are settled by an option's own facts and notes, so a model
# judges those first with no tools. Only the checks still unknown go to the
# web, one small research run per option, three at a time, each with its own
# time limit (one long node over every option used to time out).

id: notebook-checker
name: Notebook Checker
description: >
  Checks a notebook's options against its checks, ticking each one only when
  a quote from a source shows it.
status: active
source: examples
behaviors: [cite-evidence-before-claiming, declare-blind-spots]

inputs:
  NOTEBOOK:
    type: string
    required: true
    description: What the notebook is for, and this step's job.
  CHECKS:
    type: string
    required: true
    description: JSON list of the notebook's checks.
  OPTIONS:
    type: string
    required: true
    description: >
      JSON: [{"id", "name", "facts": {label: value}, "sources": [urls],
      "text": the option's own notes, "left": [checks not done yet]}].

nodes:
  # 1. Each check from the option's own facts, notes and sources: no web, so
  #    it's quick. What they don't settle is "unknown" and goes to the web.
  - id: judge
    type: llm-prompt
    maxTurns: 1
    timeout: 180
    outputContract:
      mustMatch: '<verdicts>[\s\S]*?</verdicts>'
      description: a <verdicts> JSON block
    prompt: |
      A notebook is comparing options. It's for:
      {{inputs.NOTEBOOK}}

      Its checks:
      {{inputs.CHECKS}}

      The options to check (JSON), each with the checks it still needs
      ("left"), its facts, its sources and its own notes:
      {{inputs.OPTIONS}}

      For each option, decide each check in its "left" list from the option's
      own facts and notes ONLY (you can't open pages here):
        - "met" when its facts or notes show it is true;
        - "not met" only when they clearly show it is false;
        - "unknown" when they don't say. Never guess: unknown ones are
          researched on the web next.

      For "met" and "not met", "quote" is the fact or words that show it,
      COPIED CHARACTER FOR CHARACTER from the option's facts or notes as
      given above (at least 15 characters), and "url" is "notebook". Never
      paraphrase or join pieces: code checks each quote word for word, and a
      check whose quote isn't there stays open. "why" is one plain sentence.

      Reply with only this, as valid JSON:
      <verdicts>
      [{"id": "option id", "check": "the check, as written", "verdict": "met|not met|unknown", "quote": "", "url": "notebook", "why": ""}]
      </verdicts>

  # 2. What the option's own facts didn't settle: those options, with the
  #    checks still open, for the web.
  - id: pending
    type: shell
    dependsOn: [judge]
    timeout: 30
    command: |
      python3 - <<'PY'
      import json, os, re
      from sua_helpers import upstream, tagged_json

      def norm(s):
          return re.sub(r"\s+", " ", s or "").strip().lower()

      try:
          options = [o for o in json.loads(os.environ.get("OPTIONS") or "[]") if isinstance(o, dict) and o.get("id")]
      except Exception:
          options = []
      try:
          checks = [c for c in json.loads(os.environ.get("CHECKS") or "[]") if isinstance(c, str)]
      except Exception:
          checks = []
      # Settled from its own facts (subject to verify's quote check): met or not met.
      settled = set()
      for v in tagged_json(upstream("JUDGE"), "verdicts") or []:
          if isinstance(v, dict) and str(v.get("verdict", "")).lower().strip() in ("met", "not met"):
              settled.add((str(v.get("id", "")), norm(str(v.get("check", "")))))

      items, open_checks, subjects = [], [], {}
      for o in options:
          left = [c for c in (o.get("left") if isinstance(o.get("left"), list) else checks) if isinstance(c, str)]
          todo = [c for c in left if (str(o["id"]), norm(c)) not in settled]
          if not todo:
              continue
          facts = o.get("facts") if isinstance(o.get("facts"), dict) else {}
          site = next((str(v) for k, v in facts.items() if re.search(r"web ?site|url|link", str(k), re.I) and str(v).startswith("http")), "")
          name = str(o.get("name") or o["id"]).strip()[:150]
          # At most 200 characters, as research-fanout keeps it (so its answer names it the same).
          subject = (f"{name} ({site})" if site else name)[:190].strip()
          # Same-named options stay apart: research-fanout drops repeats.
          if norm(subject) in subjects:
              subject = f"{subject} [{len(subjects) + 1}]"
          subjects[norm(subject)] = str(o["id"])
          sources = [u for u in (o.get("sources") or []) if isinstance(u, str) and u.startswith("http")][:3]
          items.append({"subject": subject, "hint": " ".join(x for x in [
              f"Checks still open for it: {'; '.join(todo)}.",
              f"Its pages: {' '.join(sources)}." if sources else "",
          ] if x)[:300]})
          for c in todo:
              if c not in open_checks:
                  open_checks.append(c)

      keys = {f"c{i + 1}": c for i, c in enumerate(open_checks)}
      ask = [{"key": k, "label": c, "hint": "\"met\" or \"not met\", only when a page you opened shows it; the quote is the words on that page that show it, copied exactly"} for k, c in keys.items()]
      print(json.dumps({
          "ok": True,
          "need_web": bool(items),
          "count": len(items),
          "items_json": json.dumps(items),
          "ask_json": json.dumps(ask),
          "keys": keys,
          "subjects": subjects,
      }))
      PY

  # 3. The open checks on the web: one small research run per option, three
  #    at a time. Optional: if it fails, the own-fact verdicts still count.
  - id: web
    type: agent-invoke
    dependsOn: [pending]
    onlyIf: { upstream: pending, field: need_web, equals: true }
    optional: true
    agentInvokeConfig:
      agentId: research-fanout
      inputMapping:
        ITEMS: "$upstream.pending.items_json"
        ASK: "$upstream.pending.ask_json"
        CONTEXT: "Checking options for a notebook: {{inputs.NOTEBOOK}}. For each check, answer \"met\" or \"not met\" only when a page you opened shows it, with the exact words; otherwise leave it under not_found. Open at most 2 pages; start with the option's own pages when given."
        DEPTH: "quick"
        MAX_ITEMS: "20"

  # 4. Code confirms each quote, from the option's own facts or the page
  #    the web research cites, before anything is ticked or ruled out.
  #    Runs whether or not the web step ran.
  - id: verify
    type: shell
    dependsOn: [judge, pending, web]
    onlyIf: { upstream: pending, field: ok, equals: true }
    timeout: 150
    command: |
      set -e
      python3 << 'PYEOF'
      import html, json, os, re, unicodedata, urllib.error, urllib.request
      from sua_helpers import upstream, last_json, tagged_json

      REPL = {"“": '"', "”": '"', "‘": "'", "’": "'", " ": " ", "—": "-", "–": "-", "…": "..."}
      def norm(s):
          s = unicodedata.normalize("NFKC", "".join(REPL.get(ch, ch) for ch in (s or "")))
          return re.sub(r"\s+", " ", s).strip().lower()

      # A site that refuses automated readers (a 401/403/429, or a bot-check
      # page): its host, so it's named and gets no screenshot (a browser is refused too).
      CHALLENGE = re.compile(r"just a moment\.\.\.|cf-chl|cf_chl|attention required|px-captcha|captcha|access is temporarily restricted|verify you are (a )?human|enable javascript and cookies", re.I)
      blocked_hosts = set()
      def host_of(url):
          return re.sub(r"^www\.", "", re.sub(r"^https?://([^/:?#]+).*$", r"\1", url or "", flags=re.I).lower())

      def page_text(url, cache={}):
          if url in cache:
              return cache[url]
          text = ""
          if len(cache) < 40 and re.match(r"^https?://", url or ""):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (sua notebook-checker)"})
                  with urllib.request.urlopen(req, timeout=8) as r:
                      raw = r.read(2_000_000).decode(r.headers.get_content_charset() or "utf-8", "replace")
                  if len(raw) < 20000 and CHALLENGE.search(raw):
                      blocked_hosts.add(host_of(url))
                      raw = ""
                  raw = re.sub(r"<(script|style|noscript)[\s\S]*?</\1>", " ", raw, flags=re.I)
                  text = html.unescape(re.sub(r"<[^>]+>", " ", raw))
              except urllib.error.HTTPError as e:
                  try:
                      body = e.read(20000).decode("utf-8", "replace")
                  except Exception:
                      body = ""
                  if e.code in (401, 403, 429) or (e.code == 503 and CHALLENGE.search(body)):
                      blocked_hosts.add(host_of(url))
                  text = ""
              except Exception:
                  text = ""
          cache[url] = text
          return text

      try:
          options = {str(o["id"]): o for o in json.loads(os.environ.get("OPTIONS") or "[]") if isinstance(o, dict) and o.get("id")}
      except Exception:
          options = {}
      try:
          checks = [c for c in json.loads(os.environ.get("CHECKS") or "[]") if isinstance(c, str)]
      except Exception:
          checks = []
      canon = {norm(c): c for c in checks}

      # The verdicts: the judge's from its own facts, then the web research's
      # (research-fanout's results, its keys c1, c2, … standing for the checks).
      verdicts = [v for v in tagged_json(upstream("JUDGE"), "verdicts") or [] if isinstance(v, dict)]
      pend = last_json(upstream("PENDING"), "subjects") or {}
      web = last_json(upstream("WEB"), "results") or {}
      keys, subjects = pend.get("keys") or {}, pend.get("subjects") or {}
      # Which option an answer is about: pending keyed its subjects by spacing and
      # case only (an em dash stays one), and research-fanout may have cut a long one short.
      def plain(s):
          return re.sub(r"\s+", " ", s or "").strip().lower()
      by_norm = {norm(k): v for k, v in subjects.items()}
      def option_of(subject):
          s = plain(subject)
          return subjects.get(s) or by_norm.get(norm(subject)) or next((v for k, v in subjects.items() if len(s) >= 40 and k.startswith(s)), None)
      for r in web.get("results") or []:
          oid = option_of(str((r or {}).get("subject") or "")) if isinstance(r, dict) else None
          found = r.get("found") if oid and isinstance(r.get("found"), dict) else {}
          for k, a in found.items():
              said = norm(str((a or {}).get("value") if isinstance(a, dict) else a))
              verdict = "not met" if said.startswith(("not met", "no", "false")) else "met" if said.startswith(("met", "yes", "true")) else ""
              if k in keys and verdict and isinstance(a, dict):
                  verdicts.append({"id": oid, "check": keys[k], "verdict": verdict, "quote": str(a.get("quote") or ""), "url": str(a.get("source") or "")})

      ticked, out_reason, tried, failed, confirmed = {}, {}, set(), set(), set()
      for v in verdicts:
          o = options.get(str(v.get("id", "")))
          check = canon.get(norm(str(v.get("check", ""))))
          verdict = str(v.get("verdict", "")).lower().strip()
          if not o or not check or verdict not in ("met", "not met"):
              continue
          if check in ticked.get(o["id"], []):
              continue
          tried.add((o["id"], check))
          quote = str(v.get("quote") or "").strip()
          url = str(v.get("url") or "").strip()
          # The judge saw the facts as compact JSON ("Employees":777); match that, the spaced form and "Label: value".
          facts_ = o.get("facts") or {}
          own = " | ".join([str(o.get("text") or ""), json.dumps(facts_, ensure_ascii=False), json.dumps(facts_, ensure_ascii=False, separators=(",", ":"))]
                           + [f"{k}: {v if isinstance(v, str) else json.dumps(v, ensure_ascii=False)}" for k, v in (facts_.items() if isinstance(facts_, dict) else [])])
          q = norm(quote)
          found = len(q) >= 15 and (q in norm(own) if url in ("", "notebook") else (q in norm(page_text(url)) or q in norm(own)))
          if not found:
              failed.add((o["id"], check))
              continue
          confirmed.add((o["id"], check))
          if verdict == "met":
              ticked.setdefault(o["id"], []).append(check)
          elif o["id"] not in out_reason:
              where = "" if url in ("", "notebook") else f" ({url})"
              # A quote of its facts reads as "Employees: 777, Founded: 2011", not JSON.
              said = re.sub(r'"([^"]+)":\s*', r"\1: ", quote).replace('"', "").replace(",", ", ").replace(",  ", ", ") if url in ("", "notebook") and '":' in quote else quote
              out_reason[o["id"]] = f'Fails "{check}": "{said[:200]}"{where}'[:300]

      facts = []
      for oid in set(ticked) | set(out_reason):
          f = {"id": oid}
          if ticked.get(oid):
              f["checked"] = ticked[oid]
          if oid in out_reason:
              f["ruleOut"] = out_reason[oid]
          facts.append(f)
      n_ticked = sum(len(v) for v in ticked.values())
      # A quote that failed counts only when no other verdict on that check held up.
      unconfirmed = len(failed - confirmed)
      # Unknown: a check still open on an option in the running that nothing answered.
      unknown = sum(1 for oid, o in options.items() if oid not in out_reason
                    for c in (o.get("left") if isinstance(o.get("left"), list) else checks)
                    if canon.get(norm(str(c))) and (oid, canon[norm(str(c))]) not in tried)
      bits = [f"{n_ticked} check{'s' if n_ticked != 1 else ''} met with a quote", f"{len(out_reason)} ruled out"]
      if unknown: bits.append(f"{unknown} unknown")
      # A "met" whose quote wasn't on the downloaded page (only a page, not the
      # notebook's own facts): a screenshot of the page gets a second look (look).
      second = []
      for v in verdicts:
          o = options.get(str(v.get("id", "")))
          check = canon.get(norm(str(v.get("check", ""))))
          url = str(v.get("url") or "").strip()
          if (o and check and str(v.get("verdict", "")).lower().strip() == "met" and (o["id"], check) in failed - confirmed
                  and re.match(r"^https?://", url) and host_of(url) not in blocked_hosts
                  and not any(x["id"] == o["id"] and x["check"] == check for x in second)):
              second.append({"id": o["id"], "check": check, "quote": str(v.get("quote") or "")[:300], "url": url})
      second = second[:4]
      # The blocked sites among the pages its unconfirmed quotes came from.
      cited = {host_of(str(v.get("url") or "")) for v in verdicts if re.match(r"^https?://", str(v.get("url") or ""))}
      print(json.dumps({"ok": True, "facts": facts, "bits": bits, "unconfirmed": unconfirmed, "second_look": second, "any_second_look": bool(second),
                        "blocked": sorted(blocked_hosts & cited)}, ensure_ascii=False))
      PYEOF

  # 5. A second look at the pages whose quote code couldn't find in their
  #    downloaded text: a screenshot of each, read by a model that sees it.
  - id: look
    type: llm-prompt
    dependsOn: [verify]
    onlyIf: { upstream: verify, field: any_second_look, equals: true }
    tools: [web-screenshot]
    maxTurns: 8
    timeout: 300
    prompt: |
      Code couldn't find these quotes in the text of their pages (some pages
      only show their text in a browser). Look at each page yourself:

      {{upstream.verify.second_look}}

      For each item, call web-screenshot once with its url and full_page true,
      then look at the picture(s). "seen" is true only when the page shows
      the quote's words, or plainly states the same fact. When it doesn't,
      or you couldn't see a picture, "seen" is false. "blocked" is true when
      the picture shows the site refusing a browser (an access-denied,
      "verify you are human" or bot-check page) instead of the page itself.
      "shown" is the words
      on the page that show it, as they appear (empty when not seen).
      "proof" is the address the tool gave for the picture, exactly as it
      wrote it (/runs/…/files/….png).

      Reply with only this, as valid JSON:
      <seen>
      [{"i": 0, "seen": true, "blocked": false, "shown": "", "proof": "/runs/…/files/….png"}]
      </seen>

  # 6. What's kept: verify's ticks and rulings, plus each check the second
  #    look saw on its page (ticked, with the screenshot as evidence).
  - id: finish
    type: shell
    dependsOn: [verify, look]
    onlyIf: { upstream: verify, field: ok, equals: true }
    timeout: 30
    command: |
      python3 << 'PYEOF'
      import json, re
      from sua_helpers import upstream, last_json, tagged_json

      v = last_json(upstream("VERIFY"), "ok") or {}
      facts = {f["id"]: f for f in v.get("facts") or [] if isinstance(f, dict) and f.get("id")}
      bits = list(v.get("bits") or [])
      second = v.get("second_look") or []
      seen = [x for x in tagged_json(upstream("LOOK"), "seen") or [] if isinstance(x, dict)]
      entries, by_shot = [], 0
      # Pages that refused the browser (a bot check): said, so it's clear why they stay open.
      # Blocked: the ones verify's download was refused by, and any the second look saw a bot check on.
      blocked = sorted(set(v.get("blocked") or []) | {re.sub(r"^www\.", "", re.sub(r"^https?://([^/:?#]+).*$", r"\1", second[x["i"]]["url"]).lower())
                        for x in seen if isinstance(x.get("i"), int) and 0 <= x["i"] < len(second) and x.get("blocked") is True})
      for x in seen:
          i = x.get("i")
          if not isinstance(i, int) or not 0 <= i < len(second) or x.get("seen") is not True:
              continue
          item = second[i]
          proof = str(x.get("proof") or "").strip()
          if not re.match(r"^/runs/[A-Za-z0-9_-]+/files/[A-Za-z0-9_-]+\.png$", proof):
              continue
          f = facts.setdefault(item["id"], {"id": item["id"]})
          if f.get("ruleOut") or item["check"] in f.get("checked", []):
              continue
          f.setdefault("checked", []).append(item["check"])
          by_shot += 1
          shown = " ".join(str(x.get("shown") or "").split())[:300]
          entries.append({"kind": "evidence", "title": f'Seen on a screenshot: {item["check"]}'[:200],
                          "body": f'{shown or item["quote"]} — {item["url"]} (screenshot: {proof})'[:1000]})
      left = int(v.get("unconfirmed") or 0) - by_shot
      bits = [b for b in bits if "not found word for word" not in b]
      if by_shot:
          bits.append(f"{by_shot} seen on a screenshot of the page")
      if left > 0:
          bits.append(f"{left} quote{'s' if left != 1 else ''} not found word for word, left open")
      if blocked:
          bits.append(f"{' and '.join(blocked) if len(blocked) <= 2 else ', '.join(blocked[:-1]) + ' and ' + blocked[-1]} refused automated reading, so {'its page' if len(blocked) == 1 else 'their pages'} couldn't be checked")
      print("<notebook>" + json.dumps({"facts": list(facts.values()), "entries": entries, "summary": "; ".join(bits) + "."}, ensure_ascii=False) + "</notebook>")
      PYEOF
