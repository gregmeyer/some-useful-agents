# Notebook Keeper — turns one pipeline agent's run output into notebook
# entries (goal surfaces G2–G3). Route-dispatched only, by the notebook
# pipeline (dashboard lib/notebook-pipeline.ts); never proposed in triage.
# Its <notebook> JSON is parsed with extractTaggedJson; entries are added with
# the source agent + run as provenance, and titles already in the notebook
# are skipped.

id: notebook-keeper
name: Notebook Keeper
description: >
  Reads what one agent in a notebook's pipeline found, against the notebook's
  goal, parameters, criteria and existing entries, and writes the new options,
  evidence, notes and ruled-out decisions worth keeping.
status: active
source: examples

inputs:
  NOTEBOOK:
    type: string
    required: true
    description: >
      The notebook as JSON: title, what it's for (statement), parameters,
      criteria (with index and whether met), and fields (what each option
      records; empty until set).
  SOURCE_AGENT:
    type: string
    required: true
    description: The pipeline agent whose output this is.
  RUN_OUTPUT:
    type: string
    required: true
    description: That agent's output (may be truncated).
  EXISTING:
    type: string
    required: false
    default: ""
    description: >
      Titles of the notebook's entries so far, one per line with their kind
      (options also show their fingerprint), so you add only what's new.

nodes:
  - id: keep
    type: llm-prompt
    outputContract:
      mustMatch: '<notebook>[\s\S]*?</notebook>'
      description: a <notebook> JSON block
    prompt: |
      You keep a notebook: a goal someone is working toward over days or
      weeks. An agent in its pipeline just ran. Decide what from its output
      is worth adding to the notebook, and nothing else.

      Do NOT use Bash, Read, Grep, Glob, web or any other tools. Work only
      from the text below.

      The notebook:
      {{inputs.NOTEBOOK}}

      Already in it (kind: title), so don't add these again, even reworded:
      {{inputs.EXISTING}}

      What `{{inputs.SOURCE_AGENT}}` found:
      ----
      {{inputs.RUN_OUTPUT}}
      ----

      Write entries of four kinds:
      - "option": a concrete candidate for the goal (a specific car, job,
        product, place), with its key facts in the title
        ("2019 Toyota RAV4 XLE AWD, 54k mi, $24,900"). Only options that fit
        the parameters.
      - "evidence": a fact that supports or rules out an option, or bears on
        a criterion ("Carfax: RAV4 clean, one owner").
      - "note": a useful observation for the goal that isn't a candidate or a
        fact about one (a market trend, a tip, a caution).
      - "decision": ONLY for ruling an option out, with why
        ("Ruled out: 2019 Outback, CVT recall not done"). Options that break
        the parameters become decisions like this when they're notable.
      Titles are one line (under 120 characters); put details in "body"
      (1–3 sentences). At most 12 entries.

      Options carry their facts as data, so they can be compared, charted
      and shown as cards:
      - "data": one value per field key from the notebook's fields (numbers
        as numbers: 4023, not "$4,023"; addresses as full https links). Leave
        out what the output doesn't say; never guess a value.
      - "fingerprint": what makes it the same option next time, in order of
        preference: a VIN or listing id, else the listing's address, else
        "year make model miles seller". An option already listed above
        (same fingerprint) that this run found again goes in again with that
        fingerprint and its current facts, so the notebook updates it
        instead of adding a copy.
      If the notebook has no fields yet and this run found options, also
      return "fields": the 4–8 facts that matter for comparing them, each
      {"key": lowercase_snake, "label", "type": money|number|text|url|image|date,
      "unit"?, "role"?}. Roles, at most one each: "price" (what it costs),
      "measure" (the main number to compare: miles, sq ft, commute minutes),
      "place", "link" (the listing), "image" (a photo of it), "when". For
      cars: price, miles, year, make_model, location, seller, listing_url,
      photo. If it was a search that found
      nothing that fits, add ONE note saying so, with where it looked
      ("Searched Craigslist Seattle for Foresters/RAV4s under $5k: nothing
      that fits yet"), so the notebook remembers it was tried. If the output
      is an error or unrelated, return no entries.

      Criteria: if the output clearly shows a criterion is now met, list its
      index with a short reason. Never mark a criterion met on a guess.

      Reply with only this, as valid JSON:
      <notebook>
      {"entries": [{"kind": "option", "title": "…", "body": "…", "data": {"price": 4023}, "fingerprint": "…"},
                   {"kind": "note", "title": "…", "body": "…"}],
       "fields": [],
       "criteriaMet": [{"index": 0, "why": "…"}],
       "summary": "one line: what this run added"}
      </notebook>
