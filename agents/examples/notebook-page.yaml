# Notebook Page — a new notebook decides its own page. From what it's for,
# what it notes and its steps, this keeps a ready-made page (the shortlist,
# for choosing among many options) or draws one that fits the outcome (a
# briefing before a meeting, an answer to a question, a plan) as an A2UI
# document bound to the notebook's data. Route-dispatched only, in the
# background once a new notebook is set up (dashboard lib/notebook-page.ts);
# never proposed in triage. Undo is on the notebook's Edit page.

id: notebook-page
name: Notebook Page
description: >
  Decides a notebook's page from what it's for: keeps the shortlist for a
  choice among many, or draws a page that fits another outcome.
status: active
source: examples

inputs:
  NOTEBOOK:
    type: string
    required: true
    description: "JSON: the notebook's title, what it's for, limits, done-whens, the facts each option notes (with roles), its steps and checks."
  PRESETS:
    type: string
    required: true
    description: The ready-made pages, one per line (id, then when it fits).
  GUIDE:
    type: string
    required: true
    description: How to draw a page (its data, settings, flags and components).
  ERRORS:
    type: string
    required: false
    default: ""
    description: Why the last page drawn couldn't be used (when trying again).
  ASK:
    type: string
    required: false
    default: ""
    description: What the person asked to change about the page (from the notebook's Edit page), if anything.
  CURRENT:
    type: string
    required: false
    default: ""
    description: The page they're asking to change, as its components (empty for the shortlist).

nodes:
  - id: page
    type: llm-prompt
    maxTurns: 1
    timeout: 180
    outputContract:
      mustMatch: '<page>[\s\S]*?</page>'
      description: a <page> JSON block
    prompt: |
      A "notebook" is a goal someone keeps over time while sua (an
      assistant) finds options, notes their facts and works through steps.
      Decide what its page shows, from what the notebook is for.

      The notebook (JSON):
      {{inputs.NOTEBOOK}}

      Ready-made pages (id: when it fits):
      {{inputs.PRESETS}}

      First decide the outcome the person is after:
        - choosing one or a few among many options (a car, a job, a flat,
          accounts to call): use the ready-made "shortlist";
        - getting ready for something (a meeting, a call, an interview):
          a briefing: who they are, what they said or care about (quotes),
          what to talk about and ask, then where it came from;
        - an answer to a question (find out, understand, compare, research):
          use the ready-made "answer": the answer first (until there is
          one, where it stands), then the findings with their evidence,
          then what's still open;
        - a plan or itinerary (a trip, a week, a project): use the
          ready-made "plan": the plan day by day, what to do first, what's
          still open, then what it draws on;
        - keeping watch on something over time (prices, listings,
          openings, back in stock): use the ready-made "watch": what
          changed since the last search first, then everything it's
          watching.
      Use a ready-made page whenever it fits ({"preset": "dossier"} for
      getting ready to meet someone, {"preset": "answer"} for a question,
      {"preset": "plan"} for a plan, {"preset": "watch"} for keeping
      watch, above all when a write step writes
      the answer or the plan); start from its page and change it
      when it nearly fits; draw one only when none does.

      Once the notebook is WRITTEN (its "written" part above lists the
      answer's or plan's parts: each with a key, its kind, its size, and
      the done-when it delivers), don't keep the ready-made page as it
      is: compose the page around what was written, the way an editor
      lays out a story from the copy. Start from the ready-made "answer"
      or "plan" page and:
        - pick ONE hero, the part that says the most at a glance: a
          diagram (a ladder, a split) over a table, a rubric table over
          steps, the answer itself when no part stands out; a diagram
          with "whatIf" (numbers the reader can move) first of all. Give it a
          full-width Panel of its own right after the answer, "hero":
          true, treatment "lede" or "feature", titled with the part's
          title, holding a Figure with "size": "hero" bound to
          /notebook/section/<its key> ("rubric": true for an If/Then/Why
          table of decisions). A page has one hero, never inside a row;
        - when a money or number fact decides it (the highest APY, the
          lowest price), say it with a number: a Lead bound to
          /notebook/numbers/<field key>/best beside the answer, and Bars
          by that field (by: its key) or a Compare of the top two where
          the options are weighed. These draw from the options as they
          are now; never type a value in;
        - place each other part where it reads best, each in its own
          Panel with an AnswerSections "only": [key] ("rubric": true for
          a table of decisions): steps beside the findings, a long table
          (over 8 rows) low in a feature or folded in a Disclosure, a
          text part as an aside;
        - shape the page from the top as "hero + rail" (the hero full
          width, then a 2:1 row), "story + rail" (a feature column with
          asides beside it) or a "band" opener (a Lead or StatStrip row,
          then the story), and vary the rows below;
        - keep one AnswerSections with "rest": true in a feature Panel
          ("Also written"), low, so a part written later still shows;
        - keep the answer's Callout, "What it rests on" (the findings
          Agenda) and the evidence (OptionGrid, low), and fold the
          research as the ready-made page does.
      Say in "about" what leads ("the ladder first, then the rubric").

      Drawing a page:
      {{inputs.GUIDE}}

      Draw for THIS notebook: lead with what it's for, bind only data it
      will have (its fields and roles above: a quote or ask role feeds
      /notebook/quotes, /notebook/talkingPoints and /notebook/questions;
      a price and a measure, the map), use Panel to title parts and
      Columns for side by side, and keep the timeline and "where sua
      looked" low. 8–30 components. When it has a profile step (it learns
      about a person or company), lead with who they are: a ProfileCard
      for /notebook/person (and one for /notebook/company), each prop
      bound to its own path, and a FactSheet of /notebook/facts with
      missing /notebook/notFound, each with "when": "about" so they wait
      until something is learned.

      What the person asked to change about the page (may be empty):
      {{inputs.ASK}}
      Their page now (may be empty, meaning the shortlist):
      {{inputs.CURRENT}}
      When they asked for something, do what they asked to their page
      now and keep the rest of it as it is (its parts, treatments and
      order), unless what they asked means a different kind of page
      ("make it a report"). Answer with the whole page. Asked to go back
      to the shortlist: {"preset": "shortlist"}.

      The last page you drew couldn't be used, because (may be empty):
      {{inputs.ERRORS}}
      If there's a reason, fix that and keep the rest.

      Reply with only one of these, as valid JSON:
      <page>
      {"preset": "shortlist", "about": "a shortlist: choosing among many"}
      </page>
      or
      <page>
      {"about": "what the page is, in a few words (a briefing: who they are, what they said, what to ask)", "components": [{"id": "root", "component": "Column", "children": ["..."]}]}
      </page>
