# Notebook TL;DR — redraws a notebook's TL;DR picture from an ask ("make it
# suitable for LinkedIn", "more editorial", "be more creative"). It doesn't
# draw: it composes the card as an A2UI view of the card's own components
# bound to its data (ADR-0096, ADR-0098), shaped as the notebook's page
# prefers unless the ask says otherwise, and may write a headline and a
# one-line takeaway. The dashboard draws the picture from that view and the
# notebook's own data, so names, numbers and bars never come from here.
# Route-dispatched only, from the notebook's Redraw page (dashboard
# lib/notebook-tldr-redraw.ts); never proposed in triage. Undo and "Back to
# the standard picture" are on that page.

id: notebook-tldr
name: Notebook TL;DR
description: >
  Composes a notebook's TL;DR picture as an A2UI view (its size, tone and
  what leads), shaped for the notebook's page unless the person asked for
  something else, and may write its headline.
status: active
source: examples

inputs:
  NOTEBOOK:
    type: string
    required: true
    description: "JSON: the notebook's title and what it's for."
  CARD:
    type: string
    required: true
    description: >
      JSON: what the standard picture says, from the notebook's data: its
      lead, the lead's facts, the numbers, the bars or the points.
  OPTIONS:
    type: string
    required: true
    description: The sizes and tones to choose from, and how to compose the view.
  PREFER:
    type: string
    required: false
    default: ""
    description: The size and lead the notebook's page prefers, to use unless ASK says otherwise.
  ASK:
    type: string
    required: true
    description: What the person asked for, in their words.
  CURRENT:
    type: string
    required: false
    default: ""
    description: "JSON: how the picture is drawn now (empty: the standard picture)."
  ERRORS:
    type: string
    required: false
    default: ""
    description: Why the last answer couldn't be used (when trying again).

nodes:
  - id: choose
    type: llm-prompt
    maxTurns: 1
    timeout: 120
    outputContract:
      mustMatch: '<tldr>[\s\S]*?</tldr>'
      description: a <tldr> JSON block
    prompt: |
      A notebook is a goal someone keeps over time: a shortlist toward a
      decision, a question answered, a meeting prepared for. It has a
      TL;DR picture: one image that sums it up, to share. The person wants
      it drawn differently. You choose how; you don't draw it.

      The notebook (JSON):
      {{inputs.NOTEBOOK}}

      What the picture says, from the notebook's own data (JSON). This is
      everything that is known; the picture's names, numbers and bars are
      filled in from it, not by you:
      {{inputs.CARD}}

      How it's drawn now (JSON; empty means the standard picture):
      {{inputs.CURRENT}}

      What you may choose from, and how to compose the card:
      {{inputs.OPTIONS}}

      What the notebook's page prefers:
      {{inputs.PREFER}}

      They asked:
      {{inputs.ASK}}

      How to compose it:
        - Always answer with a "view": you lay the card out from its
          components. Unless they name a size or what to lead with, use
          what the page prefers (above): its size, and that lead. "The way
          this page prefers" means exactly that.
        - Do what they asked and keep the rest of how it's drawn now. "For
          LinkedIn" (or X, a post, a link preview, a slide) is the
          landscape size unless they say square or tall; a phone or a
          story is portrait.
        - "Editorial", "magazine", "polished": the editorial tone, with a
          headline. "Bold", "punchy", "eye-catching", "a poster": the bold
          tone, with one thing very large (a PhotoCover, or TldrPart hero).
        - "More creative", "different", "surprise me": change the size or
          tone and what leads from how it's drawn now.
        - "Simpler", "just the numbers", "less": TldrPart header, stats and
          bars (or points), no photo. Use a part only when CARD has it:
          bars need "bars" in CARD, points need "points", photos need
          "photos".
        - "Lead with the photo", "show the picture", "more visual": a
          PhotoCover bound to /tldr/photo with the headline over it, when
          lead.picture in CARD is not "none" or CARD has "photos".
          "Use its photos", "a gallery", "side by side": a PhotoGrid bound
          to /tldr/photos, when CARD has "photos" with a count of 2 or more.
          A "logo" or "drawing" is weaker than a "photo" or "portrait":
          don't make a logo the cover.
        - Every notebook has its own drawing: its colour and an icon for
          what it's about, the same art as its card. "Use its drawing",
          "the illustration", "like its card", or a "more visual" ask with
          no picture and no photos: a PhotoCover bound to /tldr/drawing.
          "No photos", "no picture", "just the words": no PhotoCover or
          PhotoGrid.
        - Bind every picture, name and number to /tldr/… or use a TldrPart
          for the lead, stats, bars or points; your own words are only
          short labels and the headline/takeaway fields. Keep it to what
          fits the size: a lead and two or three parts. Each photo's
          credit is drawn for you.
        - A headline, when you write one, says what the picture shows in
          plain words, as a person would title a post: no hype, no
          exclamation marks, no hashtags, no emoji. It says the finding,
          not the task: the notebook's title is printed above it, so a
          headline that only rewords the title adds nothing (leave it
          out). The takeaway is one sentence a reader would repeat.
          Write them only from CARD and the notebook:
          every number or name in them must be in CARD, written as it is
          there. With nothing worth saying, leave them out; the notebook's
          title stands.
        - "about": one short sentence, to the person, on what you made
          ("Wide for the page, with its sources' photos in a grid and the
          findings under them.").

      {{inputs.ERRORS}}

      Reply with only this, as valid JSON:
      <tldr>
      {"size": "landscape", "tone": "editorial", "headline": "…", "about": "…",
       "view": [{"id": "root", "component": "Column", "children": ["head", "grid", "found"]},
                {"id": "head", "component": "TldrPart", "part": "header"},
                {"id": "grid", "component": "PhotoGrid", "photos": {"path": "/tldr/photos"}, "count": 3, "ratio": "4:3"},
                {"id": "found", "component": "TldrPart", "part": "points"}]}
      </tldr>
