# Notebook Writer — a notebook's write step. From what the notebook is for,
# who it's about and what its steps found and checked, it writes either the
# talking points for a meeting (each a point to raise, why it matters to
# them, a question, and the themes it rests on) or, when the notebook asks a
# question, the answer (how sure and why, the findings it rests on, what's
# still open), or, when it makes a plan, the plan in order (a day or slot
# each, what to book or do first, what's still open). Either cites what it rests on by id, so the quotes and
# sources shown with it are the notebook's own. Route-dispatched only, by
# the step runner (dashboard lib/notebook-write.ts); never proposed in triage.

id: notebook-writer
name: Notebook Writer
description: >
  Writes up what a notebook was for from what it found: the talking points
  for a meeting (what to raise, why it matters to them, what to ask, what to
  watch for), or the answer to its question (how sure, the findings it rests
  on, what's still open), or a plan in order (a trip, a week, a project).
status: active
source: examples

inputs:
  NOTEBOOK:
    type: string
    required: true
    description: "JSON: the notebook's title, what it's for, limits, done-whens, and who it's about (person, company: name, summary, facts)."
  THEMES:
    type: string
    required: true
    description: "JSON list: each theme's id, title, what they said (said), its question, source, when, whether it was chosen or checked, and its other facts; pages that explain are marked explains."
  COUNT:
    type: string
    required: false
    default: "4"
    description: How many talking points to write.
  SHAPE:
    type: string
    required: false
    default: "talking points"
    description: 'What to write: "talking points" (for a meeting), "answer" (to the question the notebook is for), "plan" (a plan in order) or "write-up" (a shortlist written up: the lay of the land, its groups, the top three and why, what to do next).'

nodes:
  - id: write
    type: llm-prompt
    maxTurns: 1
    timeout: 240
    outputContract:
      mustMatch: '<(briefing|answer|plan)>[\s\S]*?</(briefing|answer|plan)>'
      description: a <briefing>, <answer> or <plan> JSON block
    prompt: |
      What to write: {{inputs.SHAPE}}.

      The notebook (JSON):
      {{inputs.NOTEBOOK}}

      What sua found, each with an id (JSON). For a meeting these are
      themes: what the person has written or said. For a question they are
      the sources and findings its steps found and checked; one marked
      "explains": true is a page that explains (how it works, what to
      weigh), which an answer or plan leans on for how and why, citing it
      by its id like any other:
      {{inputs.THEMES}}

      If what to write is "answer": answer the question the notebook is for
      ("for", else its title), from what's above only. What the notebook
      knows about the company or person (its facts, its competitors) is
      above too: use it. A briefing on a company says what it does, who for,
      and who it competes with (name its competitors when there are some).
        - "answer": the answer itself, 1 to 4 sentences in plain words,
          leading with the direct answer; **bold** the key part. If what's
          above can't settle it, say what it does show and what's missing.
        - "confidence": "high" (several good sources agree), "medium"
          (some support, or sources differ) or "low" (thin, old or
          one-sided);
        - "basis": one sentence on why that confidence;
        - "findings": 3 to 6, each {"text": one sentence, a fact or a
          point the answer rests on, "from": the ids it comes from (one or
          more, only ids given above)}; most important first;
        - "open": up to 5 questions it couldn't settle, or what to check or
          do next, one sentence each.
        - "sections": the parts the ask and its done-whens ask for, beyond
          the short answer (none when it only asks a question). Up to 5,
          each with a "title" and one "kind":
            - "table" for a rubric, a framework, a scorecard, "how to think
              about…" or a comparison: {"kind": "table", "title": "…",
              "columns": 2 to 5 short headers (for a rubric, e.g. "If…",
              "Then…", "Why"), "rows": [{"cells": one per column, "from":
              ["id"]}] (up to 12), "note": optional, one sentence};
            - "steps" for "how do I…", steps, an SOP, a playbook or a
              checklist: {"kind": "steps", "title": "…", "items": [{"text":
              what to do, one line, "detail": optional, one sentence (how,
              when, what to watch for), "from": ["id"]}] (2 to 10, in
              order)};
            - "text" for an explanation the short answer can't hold (at
              most one): {"kind": "text", "title": "…", "body": up to 4
              short sentences, **bold** allowed};
            - "diagram" when a picture says it better, and only with
              numbers from above or the ask (at most two; sua draws it):
              a ladder of terms or maturities, {"kind": "diagram",
              "title": "…", "diagram": {"type": "ladder", "rungs":
              [{"label": "…", "start": month it starts (0 = now), "end":
              month it ends, "amount": number, "rate": "4.4% APY"}]}}
              (2 to 8 rungs); how an amount splits, {"type": "split",
              "total": the whole amount, "parts": [{"label": "…",
              "amount": number, "note": "…"}]} (2 to 6, adding up to the
              whole); or a decision in order, {"type": "flow", "nodes":
              [{"label": "…", "note": "…"}]} (2 to 7). Add "caption", a
              sentence on how to read it. A ladder or a split may name up
              to two "params", numbers the reader can move on the page
              and watch the drawing follow (sua recomputes it; nothing is
              written): [{"key": "amount" | "months" | "count", "label":
              "Amount to ladder"}] ("amount" the whole it divides, for a
              split or a ladder whose every rung has an amount; "months"
              a ladder's longest term; "count" its number of rungs). The
              value is the diagram's own; a "min", "max" and "step" are
              optional. Name them when the ask turns on that number (how
              much, how long, how many rungs).
          When a section gives one of the notebook's done-whens, put that
          done-when's words in "delivers", exactly as the notebook says
          it. Each row and step cites the ids it rests on; a row or step
          that nothing above supports is left out. Any number in a section
          (a rate, an amount, a term) is one from above or from the ask,
          never a new one: for "$25,000 across 5 CDs" you may write
          "$5,000 each", not a rate the sources don't give.

      When the notebook has "skip", those are findings, steps or rows the
      person said are wrong: don't write them, or one that says the same,
      again.

      Use only what's above: don't invent facts, numbers, dates or sources.
      Reply with only this, as valid JSON:
      <answer>
      {"answer": "…", "confidence": "medium", "basis": "…", "findings": [{"text": "…", "from": ["id"]}], "open": ["…"], "sections": [{"kind": "table", "title": "…", "delivers": "…", "columns": ["…", "…"], "rows": [{"cells": ["…", "…"], "from": ["id"]}]}, {"kind": "steps", "title": "…", "items": [{"text": "…", "detail": "…", "from": ["id"]}]}]}
      </answer>

      If what to write is "write-up": write up the field for a shortlist,
      in the same <answer> JSON as an answer (the same keys; "sections"
      of kind "table", "steps" and "text" only, no diagrams). What's
      above are the options, the best first by how the notebook ranks
      them, each with its facts, what it passed ("checked"), what it
      failed ("failed"), its "groups" (short labels the notebook gave its
      long facts), and whether it's "chosen"; a few marked "ruledOut"
      with why; and pages that explain what to weigh ("explains"). Say
      what the field looks like to someone deciding, not what each option
      is (the page shows them):
        - "answer": the lay of the land, 2 to 4 sentences, **bold** the
          key part: how many and of what kind, where they cluster (the
          groups), what the strongest share, what's thin or missing. When
          some are chosen, lead with those and why they stood out;
        - "confidence": how well checked the field is ("high" when the
          top ones passed every check with sources; "low" when few were
          checked or the search was thin); "basis": one sentence why;
        - "findings": 3 to 6 patterns across the field (what the top ones
          have in common, where the money or the fit is, what the
          limits rule out), each citing the ids it rests on;
        - "open": up to 5 things to check or decide next;
        - "sections", in this order:
            1. {"kind": "table", "title": "The field in groups",
               "columns": ["Group", "Which", "What they share"], "rows":
               2 to 6, one per group (by what they are, who they're
               with, where, what they cost, or by the ask's own
               distinctions); "Which" names them, "from" their ids};
            2. {"kind": "steps", "title": "The top three and why" (when
               some are chosen, "Why these", those instead), "items": 3
               (fewer when the field is smaller), in rank order, each
               "text": the option's name and, in a clause, why it leads;
               "detail": its tradeoff or what's unconfirmed; "from": its
               id};
            3. {"kind": "steps", "title": "What to do next", "items": 2
               to 6, in order: which to pursue first and how, what to
               check before that, each "from" the ids it concerns};
            4. optionally, a {"kind": "table"} rubric titled "What to
               weigh" when the ask or a done-when asks how to think about
               it, citing "explains" pages and options.
          When a section gives one of the notebook's done-whens ("a
          final list of 10 recorded", "a shortlist written"), put that
          done-when's words in "delivers", exactly as the notebook says
          it; a done-when about a list is given by the groups table.
          Every row, item and finding cites ids from above; numbers (a
          salary, a price, a count) only as the facts give them. When
          the notebook has "skip", those are findings or rows the person
          struck: don't write them, or one that says the same, again.

      If what to write is "plan": make the plan the notebook is for
      ("for", within its limits: dates, budget, where, who), from the
      places, things and options above only, in the order it happens.
        - "summary": the plan in one or two sentences (**bold** the key
          part);
        - "items": each {"when": its day, date, week or slot as the plan
          groups them ("Day 1", "Sat Oct 31", "Week 2", "Morning"),
          "title": what to do, one short line, "detail": optional, one
          sentence (when, how long, cost, why), "from": the ids it uses
          (only ids given above; none for travel or rest)}; keep items of
          the same "when" together and in order; a realistic amount per
          day, nothing that breaks the limits;
        - "before": up to 8 things to book, buy or do before it starts;
        - "open": up to 5 things still to decide.

      When the notebook has "skip", those are plan items the person said
      are wrong: don't plan them again.

        - "sections": besides the days, the parts the ask or its
          done-whens call for, in the same shapes as an answer's sections
          above: a "table" of costs (what, for whom, cost, from where) when
          the plan has a budget, "steps" to get ready, and a "diagram" of
          type "split" of the budget when the costs above add up to it
          (only real costs, its parts adding up to the whole; "params":
          [{"key": "amount", "label": "Budget"}] lets the reader move the
          budget on the page) or "ladder" for a schedule over weeks or
          months. Each row and step cites
          ids; "delivers" names a done-when it gives, word for word. None
          when the days say it all.

      Use only what's above: don't invent places, prices, hours or dates
      the items don't give; leave out what you can't place. A cost you
      don't have is left out of the table and said in "open", never
      guessed.
      Reply with only this, as valid JSON:
      <plan>
      {"summary": "…", "items": [{"when": "Day 1", "title": "…", "detail": "…", "from": ["id"]}], "before": ["…"], "open": ["…"], "sections": [{"kind": "table", "title": "…", "delivers": "…", "columns": ["…", "…"], "rows": [{"cells": ["…", "…"], "from": ["id"]}]}]}
      </plan>

      Otherwise (talking points), someone is getting ready for a meeting,
      and the items above are what they've written or said. When the
      notebook has a "meeting" with a "goal", aim the points at it: an
      easy opener first, then the points that build toward the goal, the
      last one moving toward it (a question or a next step that serves
      it); put in "watch" anything that cuts against the goal. Use its
      "notes" for what the person already knows (don't explain that back
      to them). Without a goal, as below. When the person or company has
      "unsettled" facts (sources disagree, e.g. which company they work
      for now), don't state either side as true anywhere: put an easy
      question that lets them say first in "questions" ("What are you
      spending most of your time on these days?"), not a point of its
      own, and put the disagreement in "watch".

      Write {{inputs.COUNT}} talking points for the meeting. A talking point
      is something to raise in the conversation, written as a sentence the
      person could say or steer toward ("Ask how their team decides what to
      automate and what stays human"), not the title of an article or a
      theme. For each:
        - "text": the point, one sentence, in plain words;
        - "why": why it matters to them, from what they said (one or two
          sentences; name the source in words if it helps, e.g. "in their
          newsletter on hiring");
        - "ask": one open question that gets them talking about it;
        - "from": the ids of the themes it rests on (one or more, only ids
          given above).
      Don't assume they remember what they wrote or said: it may have
      been months ago, or one of many posts. When a point rests on it,
      the point (or its "ask") reminds them in a few words what they said
      and where ("In your March post on hiring you argued for…; has that
      held up?"), never "As you know…" or "Your famous post…". Their
      title, employer and other basic facts aren't talking points: don't
      write a point whose only aim is to confirm them.

      Prefer chosen and checked themes, cover different themes rather than
      one twice, and order them the way the conversation could flow (an
      easy opener first). Then up to 5 more "questions" worth asking, and up
      to 3 things to "watch" for in the conversation with them (a sensitive
      subject, a view they hold strongly, something not to assume), each
      one sentence. Watch is about the meeting, not about gaps in the
      research.

      When the notebook has "skip", those are points the person struck:
      don't write them again, or one that makes the same point. When it
      has "keep", those are the points they're keeping: write only
      {{inputs.COUNT}} new point(s), on something none of them already
      covers, that fit alongside them ("questions" and "watch" can be
      empty).

      Use only what's above: don't invent facts, quotes, numbers or
      dates. If the themes are thin, write fewer, better points.

      Reply with only this, as valid JSON:
      <briefing>
      {"points": [{"text": "…", "why": "…", "ask": "…", "from": ["theme id"]}], "questions": ["…"], "watch": ["…"]}
      </briefing>
