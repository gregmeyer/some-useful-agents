# STARTER 1 of 4 — "Research something"
#
# Four nodes, and the middle two run AT THE SAME TIME:
#
#         ┌── gather-main ────┐
#   plan ─┤                   ├─ synthesize
#         └── gather-counter ─┘
#
# Watch the graph while it runs and you'll see both gather nodes pulse
# together. That's not decoration — `gather-counter` is deliberately hunting
# for the case AGAINST whatever the main angle finds, so the brief comes back
# with the disagreement already surfaced instead of one confident summary.
#
# The `tools:` field is what lets the model search and open pages mid-answer.
# `web-search` is the provider's own live search (claude, codex); web-fetch
# and web-scrape are sua's tools. A provider that can't do all three (Apple
# Foundation Models, a local model) is skipped for these nodes rather than
# let it answer without reading anything.
#
# Both gather nodes are `optional`: if one fails or times out, the other's
# research still reaches synthesize (with a note in place of the missing
# one), and the brief says which side it couldn't cover.
#
# Run: sua workflow run starter-research --input TOPIC="local-first software"
id: starter-research
name: Research a topic
description: >
  Plans two angles on your topic, researches both at once, then writes a
  sourced brief that names where the sources disagree.
status: active
source: examples

tags:
  - research
  - sources
  - brief
  - topic
  - citations
entryConditions:
  - user wants a researched summary or brief on a topic
  - user asks what the current state of something is and wants sources
  - user provides a URL and wants a grounded summary
nonEntryConditions:
  - user wants to monitor a page over time (use starter-watch)
  - user wants a written artifact rather than research (use starter-draft)
sampleQuestions:
  - Research local-first software and give me a sourced brief.
  - What's the current state of WebGPU support? Cite sources.
  - Give me the case for and against SQLite in production.
  - Summarize https://www.sqlite.org/whentouse.html with sources.

inputs:
  TOPIC:
    type: string
    default: local-first software
    required: true
    description: What to research. A question or URL works better than a keyword.
  DEPTH:
    type: enum
    values: [quick, thorough]
    default: quick
    description: quick = lighter research, thorough = broader source coverage.
  MIN_SOURCES_PER_ANGLE:
    type: number
    default: 2
    description: Pages to open for each angle when there are that many good ones (thorough opens about twice as many).
  MAX_CANDIDATES:
    type: number
    default: 5
    description: Most candidate products or options to return for a shopping or comparison topic.

outputs:
  headline:
    type: string
    description: One-sentence answer to the topic.
  bullets:
    type: array
    description: Findings, each {point, source_title, source_url}. Flat strings only — the template's #each supports single-level item.FIELD.
  tension:
    type: string
    description: Where the sources disagree, or empty if they broadly agree.
  source_count:
    type: string
    description: How many distinct pages were actually read.

outputWidget:
  type: ai-template
  interactive: true
  template: |
    <div style="font-family:system-ui,sans-serif;max-width:760px;">
      <div style="font:600 11px/1 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:#0f766e;">
        Research brief · {{outputs.source_count}} sources read
      </div>
      <h2 style="margin:8px 0 16px;font-size:1.25rem;line-height:1.35;">{{outputs.headline}}</h2>

      {{#each outputs.bullets as item}}
      <div style="padding:12px 0;border-top:1px solid rgba(128,128,128,.25);">
        <div style="margin-bottom:4px;">{{item.point}}</div>
        {{#if item.source_url}}
        <a href="{{item.source_url}}" target="_blank" rel="noopener"
           style="font-size:.8125rem;color:#0f766e;text-decoration:none;">
          {{item.source_title}} ↗
        </a>
        {{/if}}
        {{#unless item.source_url}}
        <span style="font-size:.8125rem;opacity:.6;">{{item.source_title}}</span>
        {{/unless}}
      </div>
      {{/each}}

      {{#if outputs.tension}}
      <div style="margin-top:16px;padding:12px 14px;border-left:3px solid #b45309;background:rgba(180,83,9,.08);">
        <div style="font:600 11px/1 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-bottom:6px;">
          Where sources disagree
        </div>
        <div style="font-size:.9375rem;">{{outputs.tension}}</div>
      </div>
      {{/if}}
      {{#unless outputs.tension}}
      <div style="margin-top:16px;font-size:.8125rem;opacity:.6;">
        Sources broadly agreed on this one.
      </div>
      {{/unless}}
    </div>
  controls:
    - type: replay
      label: Research something else
      inputs:
        - TOPIC
        - DEPTH

nodes:
  # 1. Split the topic into two angles. Cheap, no tools — this node exists so
  #    the two gather nodes below have genuinely different jobs. It says what
  #    to look for, never what the answer is: a plan that names products or
  #    prices leaks them into the brief unverified.
  - id: plan
    type: llm-prompt
    prompt: |
      Topic: {{inputs.TOPIC}}

      Split this into two research angles that a careful person would want
      covered separately:
        - main: the direct question, what it asks for, and what must be verified
        - counter: the skeptical read, including limits, objections, costs,
          failure cases, or reasons the headline claim could be overstated

      If the topic is a URL, treat that page as the primary source to summarize
      and critique.

      Important planning rules:
        - Do not name specific products, candidates, prices, retailers, stock
          status, specs, sources, citations, or URLs unless they already appear
          verbatim in the Topic.
        - Do not invent examples.
        - Describe what to search for and verify, not what the answer is.

      Answer with one short line describing each angle. Then, on the LAST line,
      emit ONLY this JSON object and nothing after it:
      {"main_angle": "...", "counter_angle": "..."}
    maxTurns: 1
    # A cold CLI start alone can take most of a minute.
    timeout: 120

  # 2 + 3. No dependsOn between these two, so the executor runs them
  #        concurrently — this is the fan-out you can see in the graph.
  #        Optional: one failing doesn't sink the brief.
  - id: gather-main
    type: llm-prompt
    dependsOn: [plan]
    optional: true
    tools: [web-search, web-fetch, web-scrape]
    prompt: |
      Topic: {{inputs.TOPIC}}

      Research plan:
      {{upstream.plan.result}}

      Research the main angle from the plan above.

      Treat the plan as search guidance only. Ignore any candidate, price,
      retailer, stock, spec, citation, or URL that appears only in the plan and
      not in the original Topic unless you independently verify it from opened
      pages.

      If Topic is a URL, fetch that exact URL first with web-fetch and ground
      the summary in that page. Then fetch supporting pages only if needed.

      If Topic is not a URL, search the web first (web-search) to discover
      relevant current sources and candidates. Then open the best pages with
      web-fetch before making claims; use web-scrape when you need structured
      fields rather than prose. Do not rely on the planning text alone as
      evidence.

      Use DEPTH to guide scope:
        - quick: open at least {{inputs.MIN_SOURCES_PER_ANGLE}} good pages if available
        - thorough: open about twice that many good pages if available

      For shopping, recommendation, or comparison topics, return up to
      {{inputs.MAX_CANDIDATES}} sourced candidates and verify price/spec/stock
      claims from opened pages.

      DEPTH: {{inputs.DEPTH}}

      Report only what you actually found after opening pages. For each claim,
      include the page title and URL. Do not pad with prior knowledge.
    maxTurns: 10
    timeout: 240

  - id: gather-counter
    type: llm-prompt
    dependsOn: [plan]
    optional: true
    tools: [web-search, web-fetch, web-scrape]
    prompt: |
      Topic: {{inputs.TOPIC}}

      Research plan:
      {{upstream.plan.result}}

      Research the counter angle from the plan above.

      Treat the plan as search guidance only. Ignore any candidate, price,
      retailer, stock, spec, citation, or URL that appears only in the plan and
      not in the original Topic unless you independently verify it from opened
      pages.

      If Topic is a URL, fetch that exact URL first with web-fetch and identify
      what the page itself proves, what it does not prove, and where its claims
      may be limited. Then fetch supporting or dissenting pages only if needed.

      If Topic is not a URL, search the web first (web-search) to discover
      relevant current skeptical, comparative, or limiting evidence. Then open
      the best pages with web-fetch before making claims. Do not rely on the
      planning text alone as evidence.

      Use DEPTH to guide scope:
        - quick: open at least {{inputs.MIN_SOURCES_PER_ANGLE}} good pages if available
        - thorough: open about twice that many good pages if available

      DEPTH: {{inputs.DEPTH}}

      Report what you found with the page title and URL beside each claim. If
      the skeptical case is weak, say so plainly. Do not manufacture controversy.
    maxTurns: 10
    timeout: 240

  # 4. Merge. Runs once both gather nodes are done, or once one of them has
  #    given up: a failed one arrives as `(step "…" didn't finish: …)`.
  - id: synthesize
    type: llm-prompt
    dependsOn: [gather-main, gather-counter]
    prompt: |
      Topic: {{inputs.TOPIC}}

      Main-angle research:
      {{upstream.gather-main.result}}

      Counter-angle research:
      {{upstream.gather-counter.result}}

      Write the brief. Lead with the conclusion. Only use claims that appeared
      in the research above — if something wasn't found, leave it out rather
      than filling the gap from memory.

      If one side reads `(step "…" didn't finish: …)`, that research is
      missing: write the brief from the side that finished, and say plainly
      in "tension" that the main (or skeptical) side couldn't be researched
      this time, so the brief is one-sided. If both are missing, say so in
      the headline and give no bullets.

      Then, on the LAST line, emit ONLY this JSON object and nothing after it:
      {"headline": "one sentence answering the topic",
       "bullets": [{"point": "a concrete claim", "source_title": "page title", "source_url": "https://..."}],
       "tension": "one sentence on where the two angles disagreed, or \"\" if they broadly agreed",
       "source_count": "3"}

      Rules for that JSON:
        - 3 to 5 bullets (none if no research finished).
        - Each point is one concrete sentence, no hedging.
        - source_title must be the title or recognizable name of the source page.
        - `source_url` must be a URL that actually appears above. If a claim
          has no source, use "" and say so in the point.
        - Keep every value a flat string. No nested objects inside bullets.
    maxTurns: 1
    timeout: 120
