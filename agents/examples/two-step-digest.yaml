# Tutorial step 2: Chain two nodes — fetch data, then format it.
# Teaches: dependsOn, upstream output passing ($UPSTREAM_<ID>_RESULT), and a
# view that draws structured output (one row per headline).
# Run: sua workflow run two-step-digest
id: two-step-digest
name: Two-step digest
description: Reads local headlines and formats a summary. Teaches dependsOn + upstream passing.
status: active
source: examples

# Cross-run outcome feedback. Declaring this input is the ONLY thing needed to
# opt in — when the PREVIOUS run of this agent missed its outcome, sua fills it
# with what went wrong and the evidence behind it. Undeclared inputs are dropped
# by the executor, so agents that don't want this are unaffected.
tags:
  - news
  - headlines
  - digest
  - roundup
  - briefing
entryConditions:
  - user wants a roundup of the day's news headlines
  - user wants local headlines read and summarized into a short briefing
nonEntryConditions:
  - user wants a researched multi-source report on one topic (use research-digest)
sampleQuestions:
  - Summarize today's top stories.
  - What is going on in the world this morning?
  - Catch me up on the headlines.
inputs:
  OUTCOME_FEEDBACK:
    type: string
    required: false
    default: ""
    description: >
      What the previous run failed to achieve, when it missed its declared
      outcome. Empty on the first run and after any run that succeeded.

outputs:
  headlines:
    type: array
    description: The headlines read from the source file, each with title, source, category, url, summary and image.
  count:
    type: number
    description: How many headlines were loaded.
  summary:
    type: string
    description: The count line, e.g. "10 headlines loaded."
  note:
    type: string
    description: What the previous run missed, when it missed its outcome (empty otherwise).
signal:
  title: Daily Digest
  icon: "\U0001F4F0"
  template: widget
  size: 2x1
# The view draws every run (the run page, the agent's board tile, chat): each
# headline as a story (thumbnail, title linked to the article, a line of
# summary, source), then the count line. It binds the JSON fields the
# summarise step prints — never the raw text.
view:
  components:
    - { id: root, component: Column, children: [stories, count_line] }
    - { id: stories, component: Stories, items: { path: /outputs/headlines }, maxItems: 10 }
    - { id: count_line, component: Text, text: { path: /outputs/summary }, variant: caption }
# OutcomeDetection: what this agent is supposed to RESULT in, and what
# counts as evidence of it. Inert unless the caller passes an
# `onRunComplete: outcomeDetectionHook({ outcomeStore })` dep — adding this
# block changes nothing about how the agent executes.
#
# Note the split from `successCriteria:` (not used here): that one is a
# CONTROL input that makes the agent re-run on failure. This is an
# OBSERVATION input. See docs/outcome-detection.md.
outcome:
  expected: >
    A digest was produced that lists headlines read from the source file and
    ends with a count line reporting a non-zero number of headlines loaded.
  assumptions:
    - The source file is valid JSON with one "title" key per headline.
  evidence:
    - kind: nodeStatus
      nodeId: fetch
      label: Did the source file read succeed?
    - kind: nodeResult
      nodeId: summarise
      label: The digest text itself
    - kind: nodeOutputField
      nodeId: fetch
      field: bytes
      label: How much source data was read
    - kind: runStatus
  success:
    - kind: shellExitZero
      nodeId: summarise
    - kind: regexMatch
      nodeId: summarise
      pattern: "[1-9][0-9]* headlines loaded"

nodes:
  - id: fetch
    type: shell
    tool: file-read
    toolInputs:
      path: agents/examples/data/sample-headlines.json
  - id: summarise
    type: shell
    # The fetch node's result (the file's text) arrives as $UPSTREAM_FETCH_RESULT.
    # Print the digest as JSON so the view can draw one story per headline:
    # a step whose result is a JSON object exposes its fields at /outputs/<field>.
    # Each headline keeps what the Stories view draws: url, summary, image.
    # Last run's shortfall ($OUTCOME_FEEDBACK) is passed on as `note`, so the
    # feedback loop is visible end to end. A real agent would ACT on it
    # (widen the query, pick another source) rather than just reporting it.
    command: |
      node -e '
        let headlines = [];
        try { headlines = JSON.parse(process.env.UPSTREAM_FETCH_RESULT || "{}").headlines ?? []; } catch {}
        console.log(JSON.stringify({
          headlines: headlines.map((h) => ({ title: h.title, source: h.source, category: h.category, url: h.url, summary: h.summary, image: h.image })),
          count: headlines.length,
          summary: `${headlines.length} headlines loaded.`,
          note: process.env.OUTCOME_FEEDBACK || "",
        }, null, 2));
      '
    dependsOn: [fetch]
